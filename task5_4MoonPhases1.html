<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            color:white;
            margin:0;
            margin-bottom: 100px;
            margin-top:50px;
            background-image:url(
            https://images.unsplash.com/photo-1505506874110-6a7a69069a08?w=1200&auto=format&fit=crop&q=80
            );
            background-repeat:no-repeat;
            background-size:cover;
            background-position:center;
            height:100%;
            width:100%;
            font-family:Arial, Helvetica, sans-serif;
            background-attachment: fixed;
        }

        h1{
            text-align:center;
            font-size:32px;
            margin-top:10px;
        }

        b{
            color:yellow;
            font-size:48px;
            display:block;
            text-align:center;
            line-height:50px;
        }

        #main{
            width:1100px;
            height:610px;
            margin:auto;
            position:relative;
        }

        img{
            width:180px;
            height:180px;
            border-radius:50%;
            position:absolute;
            top:210px;
            left:460px;
            box-shadow:2px 2px 30px skyblue;
        }

        .moon{
            width:90px;
            height:90px;
            border:2px solid white;
            border-radius:50%;
            position:absolute;
            background-color:rgb(29,28,28);
            box-shadow:2px 2px 15px white;
        }
        p{
            font-weight:bolder;
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size:15px;
            color:goldenrod;
            position:absolute;
        }

        #a{
            top:5px;
            left:495px;
        }

        #one{
            top:30px;
            left:505px;
        }

        #b{
            top:75px;
            left:750px;
        }

        #two{
            top:105px;
            left:760px;
            box-shadow:-10px -5px 5px wheat inset;
        }

        #c{
            top:245px;
            left:875px;
        }

        #three{
            top:275px;
            left:880px;
            box-shadow:-40px 0px 10px wheat inset;
        }

        #d{
            top:445px;
            left:745px;
        }

        #four{
            top:475px;
            left:760px;
            box-shadow:-55px 0px 10px wheat inset;
        }

        #e{
            top:490px;
            left:495px;
            
        }

        #five{
            top:520px;
            left:505px;
            box-shadow:100px 0px 10px wheat inset;
        }

        #f{
            top:445px;
            left:225px;
        }

        #six{
            top:475px;
            left:250px;
            box-shadow:-50px 0px 10px wheat inset;
        }

        #g{
            top:245px;
            left:70px;
        }

        #seven{
            top:275px;
            left:120px;
            box-shadow:40px 2px 10px wheat inset;
            
        }

        #h{
            top:75px;
            left:225px;
        }

        #eight{
            top:105px;
            left:250px;
            box-shadow:8px 0px 5px wheat inset;

        }

    </style>
</head>

<body>
    <h1>PHASES OF</h1>
    <b>THE MOON</b>
    <div id="main">
        <img
            src="https://upload.wikimedia.org/wikipedia/commons/9/97/The_Earth_seen_from_Apollo_17.jpg"
            alt="Earth"/>

        <p id="a">1. NEW MOON</p>
        <div class="moon" id="one"></div>

        <p id="b">2. WAXING CRESCENT</p>
        <div class="moon" id="two"></div>

        <p id="c">3. FIRST QUARTER</p>
        <div class="moon" id="three"></div>

        <p id="d">4. WAXING GIBBOUS</p>
        <div class="moon" id="four"></div>

        <p id="e">5. FULL MOON</p>
        <div class="moon" id="five"></div>

        <p id="f">6. WANING GIBBOUS</p>
        <div class="moon" id="six"></div>

        <p id="g">7. THIRD QUARTER</p>
        <div class="moon" id="seven"></div>

        <p id="h">8. WANING CRESCENT</p>
        <div class="moon" id="eight"></div>

    </div>

</body>
</html>
